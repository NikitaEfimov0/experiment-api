<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Experiment Admin</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --border: #e2e6ec;
    --text: #1c2733; --muted: #6b7684; --accent: #2563eb; --accent-dark: #1d4ed8;
    --danger: #dc2626; --ok: #16a34a; --warn: #d97706;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; gap: 24px; height: 56px; position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 16px; margin: 0; }
  header nav a { color: var(--muted); text-decoration: none; font-size: 14px; margin-right: 16px; padding: 4px 0; }
  header nav a.active { color: var(--accent); font-weight: 600; border-bottom: 2px solid var(--accent); }
  header .spacer { flex: 1; }
  header a.doclink { color: var(--muted); font-size: 13px; text-decoration: none; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  .card h2 { margin: 0 0 12px; font-size: 16px; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; flex-wrap: wrap; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr.rowlink { cursor: pointer; }
  tr.rowlink:hover { background: #f0f4fa; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .btn:hover { background: #f0f2f5; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-dark); }
  .btn.danger { color: var(--danger); border-color: #f3c9c9; }
  .btn.danger:hover { background: #fdf2f2; }
  .btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .btn.warn { background: var(--warn); border-color: var(--warn); color: #fff; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.small { padding: 4px 10px; font-size: 12px; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.idle { background: #eef1f5; color: var(--muted); }
  .badge.recording { background: #fdecec; color: var(--danger); }
  .badge.recording::before { content: "●"; margin-right: 5px; animation: blink 1s infinite; }
  .badge.stopped { background: #fff4e0; color: var(--warn); }
  .badge.data { background: #e7f6ec; color: var(--ok); }
  @keyframes blink { 50% { opacity: .3; } }
  .pager { display: flex; align-items: center; gap: 10px; justify-content: flex-end; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .muted { color: var(--muted); }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .empty { text-align: center; padding: 32px; color: var(--muted); }
  dl.kv { display: grid; grid-template-columns: 160px 1fr; gap: 6px 16px; margin: 0; font-size: 14px; }
  dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; }
  .props-chips span { display: inline-block; background: #eef1f5; border-radius: 6px; padding: 2px 8px; margin: 2px 4px 2px 0; font-size: 12px; }
  /* Modal */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: flex-start; justify-content: center; padding: 60px 16px; z-index: 50; }
  .modal { background: var(--card); border-radius: 12px; padding: 24px; width: 100%; max-width: 520px; max-height: 80vh; overflow: auto; }
  .modal h3 { margin: 0 0 16px; font-size: 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .field input { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; }
  .field input:focus { outline: 2px solid #bfd4fb; border-color: var(--accent); }
  .prop-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .prop-row input { flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 800px) { .grid2 { grid-template-columns: 1fr; } }
  .chart-box { position: relative; height: 240px; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: #1c2733; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px; z-index: 100; opacity: 0; transition: opacity .2s; }
  .toast.show { opacity: 1; }
  .toast.error { background: var(--danger); }
  .crumbs { font-size: 13px; margin-bottom: 14px; color: var(--muted); }
  .crumbs a { color: var(--accent); text-decoration: none; }
  .stats-table td, .stats-table th { padding: 6px 10px; }
</style>
</head>
<body>
<header>
  <h1>🧪 Experiment Admin</h1>
  <nav>
    <a href="#/experiments" id="nav-experiments">Experiments</a>
    <a href="#/exercises" id="nav-exercises">Exercises</a>
  </nav>
  <div class="spacer"></div>
  <a class="doclink" href="/docs" target="_blank">API docs ↗</a>
</header>
<main id="view"></main>
<div id="toast" class="toast"></div>

<script>
'use strict';

// ---------------------------------------------------------------------------
// API helper
// ---------------------------------------------------------------------------
async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body !== undefined ? { 'Content-Type': 'application/json' } : {},
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  if (res.status === 204) return null;
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || res.statusText);
  return json;
}

// ---------------------------------------------------------------------------
// Utilities
// ---------------------------------------------------------------------------
const $view = document.getElementById('view');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmtDate = (d) => d ? new Date(d).toLocaleString() : '—';
const fmtNum = (v) => v == null ? '—' : v;
const shortId = (id) => `<span class="mono" title="${esc(id)}">${esc(String(id).slice(0, 8))}…</span>`;

let toastTimer;
function toast(msg, isError) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

function statusBadge(ex) {
  const cls = ex.recordingStatus;
  const label = { idle: 'Idle', recording: 'Recording', stopped: 'Stopped' }[cls] || cls;
  let html = `<span class="badge ${cls}">${label}</span>`;
  if (ex.hasData) html += ` <span class="badge data">Data</span>`;
  return html;
}

function propsChips(props) {
  const entries = Object.entries(props || {});
  if (!entries.length) return '<span class="muted">—</span>';
  return '<span class="props-chips">' + entries.map(([k, v]) => `<span><b>${esc(k)}</b>: ${esc(v)}</span>`).join('') + '</span>';
}

// ---------------------------------------------------------------------------
// Modal with dynamic property rows
// ---------------------------------------------------------------------------
function openModal({ title, fields = [], properties = {}, submitLabel = 'Save', onSubmit }) {
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>${esc(title)}</h3>
      <form id="modal-form">
        ${fields.map((f) => `
          <div class="field">
            <label>${esc(f.label)}</label>
            <input name="${esc(f.name)}" type="${f.type || 'text'}" step="any"
                   value="${f.value != null ? esc(f.value) : ''}" placeholder="${esc(f.placeholder || '')}" />
          </div>`).join('')}
        <div class="field">
          <label>Custom properties</label>
          <div id="prop-rows"></div>
          <button type="button" class="btn small" id="add-prop">+ Add property</button>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn" id="modal-cancel">Cancel</button>
          <button type="submit" class="btn primary">${esc(submitLabel)}</button>
        </div>
      </form>
    </div>`;
  document.body.appendChild(backdrop);

  const rows = backdrop.querySelector('#prop-rows');
  function addPropRow(k = '', v = '') {
    const row = document.createElement('div');
    row.className = 'prop-row';
    row.innerHTML = `
      <input placeholder="key" class="pk" value="${esc(k)}" />
      <input placeholder="value" class="pv" value="${esc(v)}" />
      <button type="button" class="btn small danger">✕</button>`;
    row.querySelector('button').onclick = () => row.remove();
    rows.appendChild(row);
  }
  Object.entries(properties).forEach(([k, v]) => addPropRow(k, v));
  backdrop.querySelector('#add-prop').onclick = () => addPropRow();

  const close = () => backdrop.remove();
  backdrop.querySelector('#modal-cancel').onclick = close;
  backdrop.addEventListener('mousedown', (e) => { if (e.target === backdrop) close(); });

  backdrop.querySelector('#modal-form').onsubmit = async (e) => {
    e.preventDefault();
    const values = {};
    for (const f of fields) {
      const raw = e.target.elements[f.name].value.trim();
      if (f.type === 'number') values[f.name] = raw === '' ? null : Number(raw);
      else values[f.name] = raw === '' ? null : raw;
    }
    const props = {};
    rows.querySelectorAll('.prop-row').forEach((row) => {
      const k = row.querySelector('.pk').value.trim();
      const v = row.querySelector('.pv').value;
      if (k) props[k] = v;
    });
    values.properties = props;
    try {
      await onSubmit(values);
      close();
    } catch (err) {
      toast(err.message, true);
    }
  };
}

// ---------------------------------------------------------------------------
// Views
// ---------------------------------------------------------------------------

async function viewExperiments(page) {
  const data = await api('GET', `/experiments?page=${page}&pageSize=20`);
  const pages = Math.max(1, Math.ceil(data.total / data.pageSize));
  $view.innerHTML = `
    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0">Experiments <span class="muted">(${data.total})</span></h2>
        <button class="btn primary" id="new-exp">+ New experiment</button>
      </div>
      ${data.items.length ? `
      <table>
        <thead><tr><th>ID</th><th>Patient</th><th>Age</th><th>Height</th><th>Weight</th><th>Properties</th><th>Created</th><th></th></tr></thead>
        <tbody>
          ${data.items.map((e) => `
            <tr class="rowlink" data-id="${esc(e.id)}">
              <td>${shortId(e.id)}</td>
              <td><b>${esc(e.patientNumber ?? '—')}</b></td>
              <td>${fmtNum(e.age)}</td>
              <td>${e.height != null ? esc(e.height) + ' cm' : '—'}</td>
              <td>${e.weight != null ? esc(e.weight) + ' kg' : '—'}</td>
              <td>${propsChips(e.properties)}</td>
              <td class="muted">${fmtDate(e.createdAt)}</td>
              <td><button class="btn small danger del" data-id="${esc(e.id)}">Delete</button></td>
            </tr>`).join('')}
        </tbody>
      </table>
      <div class="pager">
        <button class="btn small" id="prev" ${page <= 1 ? 'disabled' : ''}>‹ Prev</button>
        <span>Page ${data.page} of ${pages}</span>
        <button class="btn small" id="next" ${page >= pages ? 'disabled' : ''}>Next ›</button>
      </div>` : `<div class="empty">No experiments yet. Create the first one.</div>`}
    </div>`;

  document.getElementById('new-exp').onclick = () => openModal({
    title: 'New experiment',
    fields: experimentFields(),
    submitLabel: 'Create',
    onSubmit: async (v) => { await api('POST', '/experiments', v); toast('Experiment created'); route(); },
  });
  $view.querySelectorAll('tr.rowlink').forEach((tr) => {
    tr.onclick = (e) => { if (!e.target.closest('button')) location.hash = `#/experiments/${tr.dataset.id}`; };
  });
  $view.querySelectorAll('.del').forEach((b) => {
    b.onclick = async () => {
      if (!confirm('Delete this experiment and ALL its exercises and data?')) return;
      try { await api('DELETE', `/experiments/${b.dataset.id}`); toast('Experiment deleted'); route(); }
      catch (err) { toast(err.message, true); }
    };
  });
  const prev = document.getElementById('prev'), next = document.getElementById('next');
  if (prev) prev.onclick = () => location.hash = `#/experiments?page=${page - 1}`;
  if (next) next.onclick = () => location.hash = `#/experiments?page=${page + 1}`;
}

function experimentFields(e = {}) {
  return [
    { name: 'patientNumber', label: 'Patient number', value: e.patientNumber, placeholder: 'P-0042' },
    { name: 'age', label: 'Age (years)', type: 'number', value: e.age },
    { name: 'height', label: 'Height (cm)', type: 'number', value: e.height },
    { name: 'weight', label: 'Weight (kg)', type: 'number', value: e.weight },
  ];
}

async function viewExperimentDetail(id) {
  const [exp, exercises] = await Promise.all([
    api('GET', `/experiments/${id}`),
    api('GET', `/experiments/${id}/exercises`),
  ]);
  $view.innerHTML = `
    <div class="crumbs"><a href="#/experiments">Experiments</a> / ${esc(exp.patientNumber ?? exp.id)}</div>
    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0">Experiment — ${esc(exp.patientNumber ?? '(no patient number)')}</h2>
        <div>
          <button class="btn" id="edit-exp">Edit</button>
          <button class="btn danger" id="del-exp">Delete</button>
        </div>
      </div>
      <dl class="kv">
        <dt>ID</dt><dd class="mono">${esc(exp.id)}</dd>
        <dt>Patient number</dt><dd>${esc(exp.patientNumber ?? '—')}</dd>
        <dt>Age</dt><dd>${fmtNum(exp.age)}</dd>
        <dt>Height</dt><dd>${exp.height != null ? esc(exp.height) + ' cm' : '—'}</dd>
        <dt>Weight</dt><dd>${exp.weight != null ? esc(exp.weight) + ' kg' : '—'}</dd>
        <dt>Created</dt><dd>${fmtDate(exp.createdAt)}</dd>
        <dt>Properties</dt><dd>${propsChips(exp.properties)}</dd>
      </dl>
    </div>
    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0">Exercises <span class="muted">(${exercises.length})</span></h2>
        <button class="btn primary" id="new-ex">+ New exercise</button>
      </div>
      ${exercises.length ? `
      <table>
        <thead><tr><th>ID</th><th>Status</th><th>Properties</th><th>Created</th><th>Recorded</th><th></th></tr></thead>
        <tbody>
          ${exercises.map((x) => `
            <tr class="rowlink" data-id="${esc(x.id)}">
              <td>${shortId(x.id)}</td>
              <td>${statusBadge(x)}</td>
              <td>${propsChips(x.properties)}</td>
              <td class="muted">${fmtDate(x.createdAt)}</td>
              <td class="muted">${x.recordingStartedAt ? fmtDate(x.recordingStartedAt) : '—'}</td>
              <td><button class="btn small danger del" data-id="${esc(x.id)}">Delete</button></td>
            </tr>`).join('')}
        </tbody>
      </table>` : `<div class="empty">No exercises yet.</div>`}
    </div>`;

  document.getElementById('edit-exp').onclick = () => openModal({
    title: 'Edit experiment',
    fields: experimentFields(exp),
    properties: exp.properties,
    onSubmit: async (v) => { await api('PATCH', `/experiments/${id}`, v); toast('Experiment updated'); route(); },
  });
  document.getElementById('del-exp').onclick = async () => {
    if (!confirm('Delete this experiment and ALL its exercises and data?')) return;
    try { await api('DELETE', `/experiments/${id}`); toast('Experiment deleted'); location.hash = '#/experiments'; }
    catch (err) { toast(err.message, true); }
  };
  document.getElementById('new-ex').onclick = () => openModal({
    title: 'New exercise',
    fields: [],
    submitLabel: 'Create',
    onSubmit: async (v) => {
      const ex = await api('POST', `/experiments/${id}/exercises`, { properties: v.properties });
      toast('Exercise created');
      location.hash = `#/exercises/${ex.id}`;
    },
  });
  $view.querySelectorAll('tr.rowlink').forEach((tr) => {
    tr.onclick = (e) => { if (!e.target.closest('button')) location.hash = `#/exercises/${tr.dataset.id}`; };
  });
  $view.querySelectorAll('.del').forEach((b) => {
    b.onclick = async () => {
      if (!confirm('Delete this exercise?')) return;
      try { await api('DELETE', `/exercises/${b.dataset.id}`); toast('Exercise deleted'); route(); }
      catch (err) { toast(err.message, true); }
    };
  });
}

async function viewAllExercises(page) {
  const data = await api('GET', `/exercises?page=${page}&pageSize=20`);
  const pages = Math.max(1, Math.ceil(data.total / data.pageSize));
  $view.innerHTML = `
    <div class="card">
      <div class="toolbar"><h2 style="margin:0">All exercises <span class="muted">(${data.total})</span></h2></div>
      ${data.items.length ? `
      <table>
        <thead><tr><th>ID</th><th>Experiment</th><th>Status</th><th>Properties</th><th>Created</th></tr></thead>
        <tbody>
          ${data.items.map((x) => `
            <tr class="rowlink" data-id="${esc(x.id)}">
              <td>${shortId(x.id)}</td>
              <td><a href="#/experiments/${esc(x.experimentId)}" onclick="event.stopPropagation()">${shortId(x.experimentId)}</a></td>
              <td>${statusBadge(x)}</td>
              <td>${propsChips(x.properties)}</td>
              <td class="muted">${fmtDate(x.createdAt)}</td>
            </tr>`).join('')}
        </tbody>
      </table>
      <div class="pager">
        <button class="btn small" id="prev" ${page <= 1 ? 'disabled' : ''}>‹ Prev</button>
        <span>Page ${data.page} of ${pages}</span>
        <button class="btn small" id="next" ${page >= pages ? 'disabled' : ''}>Next ›</button>
      </div>` : `<div class="empty">No exercises yet.</div>`}
    </div>`;
  $view.querySelectorAll('tr.rowlink').forEach((tr) => {
    tr.onclick = (e) => { if (!e.target.closest('a')) location.hash = `#/exercises/${tr.dataset.id}`; };
  });
  const prev = document.getElementById('prev'), next = document.getElementById('next');
  if (prev) prev.onclick = () => location.hash = `#/exercises?page=${page - 1}`;
  if (next) next.onclick = () => location.hash = `#/exercises?page=${page + 1}`;
}

async function viewExerciseDetail(id) {
  const ex = await api('GET', `/exercises/${id}`);
  $view.innerHTML = `
    <div class="crumbs">
      <a href="#/experiments">Experiments</a> /
      <a href="#/experiments/${esc(ex.experimentId)}">Experiment ${esc(ex.experimentId.slice(0, 8))}…</a> /
      Exercise ${esc(ex.id.slice(0, 8))}…
    </div>
    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0">Exercise ${statusBadge(ex)}</h2>
        <div id="rec-controls"></div>
      </div>
      <dl class="kv">
        <dt>ID</dt><dd class="mono">${esc(ex.id)}</dd>
        <dt>Experiment</dt><dd><a href="#/experiments/${esc(ex.experimentId)}" class="mono">${esc(ex.experimentId)}</a></dd>
        <dt>Created</dt><dd>${fmtDate(ex.createdAt)}</dd>
        <dt>Recording started</dt><dd>${fmtDate(ex.recordingStartedAt)}</dd>
        <dt>Recording ended</dt><dd>${fmtDate(ex.recordingEndedAt)}</dd>
        <dt>Properties</dt><dd>${propsChips(ex.properties)}</dd>
      </dl>
    </div>
    <div id="data-section"></div>`;

  const controls = document.getElementById('rec-controls');
  const btn = (label, cls, fn, disabled) => {
    const b = document.createElement('button');
    b.className = `btn ${cls}`;
    b.textContent = label;
    b.disabled = !!disabled;
    b.onclick = fn;
    controls.appendChild(b);
    controls.appendChild(document.createTextNode(' '));
  };
  const act = (fn) => async () => {
    try { await fn(); route(); } catch (err) { toast(err.message, true); }
  };
  if (ex.recordingStatus === 'recording') {
    btn('■ Stop recording', 'warn', act(async () => { await api('POST', `/exercises/${id}/recording/stop`); toast('Recording stopped — data captured'); }));
  } else {
    btn('● Start recording', 'ok', act(async () => { await api('POST', `/exercises/${id}/recording/start`); toast('Recording started'); }), ex.hasData);
  }
  if (ex.hasData) {
    btn('Clear data', 'danger', act(async () => {
      if (!confirm('Clear recorded data? The exercise can then be re-recorded.')) throw new Error('cancelled');
      await api('DELETE', `/exercises/${id}/data`);
      toast('Data cleared');
    }));
  }
  btn('Delete exercise', 'danger', async () => {
    if (!confirm('Delete this exercise completely?')) return;
    try { await api('DELETE', `/exercises/${id}`); toast('Exercise deleted'); location.hash = `#/experiments/${ex.experimentId}`; }
    catch (err) { toast(err.message, true); }
  });

  const section = document.getElementById('data-section');
  if (!ex.hasData) {
    section.innerHTML = `<div class="card"><div class="empty">${
      ex.recordingStatus === 'recording'
        ? 'Recording in progress… stop the recording to capture data.'
        : 'No recorded data yet. Start a recording to capture sensor data.'
    }</div></div>`;
    return;
  }
  const data = await api('GET', `/exercises/${id}/data`);
  renderData(section, data);
}

function renderData(section, data) {
  section.innerHTML = `
    <div class="card">
      <h2>Recorded data</h2>
      <p class="muted" style="font-size:13px">
        Recorded ${fmtDate(data.startedAt)} → ${fmtDate(data.endedAt)}
      </p>
      <div class="grid2">
        <div><h3 style="font-size:14px">Mouth opening <span class="muted">(rel. to frame, ${data.mouthOpening.sampleRate} Hz)</span></h3><div class="chart-box"><canvas id="c-mouth"></canvas></div></div>
        <div><h3 style="font-size:14px">Sound pressure <span class="muted">(${esc(data.soundPressure.unit)}, ${data.soundPressure.sampleRate} Hz)</span></h3><div class="chart-box"><canvas id="c-sound"></canvas></div></div>
        <div><h3 style="font-size:14px">Foot speed <span class="muted">(${esc(data.footSpeed.unit)}, ${data.footSpeed.sampleRate} Hz)</span></h3><div class="chart-box"><canvas id="c-foot"></canvas></div></div>
        <div><h3 style="font-size:14px">Step lengths <span class="muted">(${esc(data.aggregates.stepLengths.unit)})</span></h3><div class="chart-box"><canvas id="c-steps"></canvas></div></div>
      </div>
    </div>
    <div class="card">
      <h2>Aggregates</h2>
      <table class="stats-table">
        <thead><tr><th></th><th>Mouth opening (vert.)</th><th>Mouth opening (horiz.)</th><th>Sound pressure</th><th>Foot speed</th><th>Step length</th></tr></thead>
        <tbody>
          ${['averages', 'medians'].map((key) => {
            const s = data.aggregates[key] || {};
            return `<tr><td><b>${key === 'averages' ? 'Average' : 'Median'}</b></td>
              <td>${fmtNum(s.mouthOpeningVertical)}</td><td>${fmtNum(s.mouthOpeningHorizontal)}</td>
              <td>${fmtNum(s.soundPressure)}</td><td>${fmtNum(s.footSpeed)}</td><td>${fmtNum(s.stepLength)}</td></tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;

  const lineOpts = {
    responsive: true, maintainAspectRatio: false, animation: false,
    plugins: { legend: { labels: { boxWidth: 12, font: { size: 11 } } } },
    scales: { x: { ticks: { maxTicksLimit: 10, font: { size: 10 } } }, y: { ticks: { font: { size: 10 } } } },
    elements: { point: { radius: 0 } },
  };
  const labels = (n) => Array.from({ length: n }, (_, i) => i);

  new Chart(document.getElementById('c-mouth'), {
    type: 'line',
    data: {
      labels: labels(data.mouthOpening.values.length),
      datasets: [
        { label: 'Vertical', data: data.mouthOpening.values.map((t) => t[0]), borderColor: '#2563eb', borderWidth: 1.5 },
        { label: 'Horizontal', data: data.mouthOpening.values.map((t) => t[1]), borderColor: '#16a34a', borderWidth: 1.5 },
      ],
    },
    options: lineOpts,
  });
  new Chart(document.getElementById('c-sound'), {
    type: 'line',
    data: { labels: labels(data.soundPressure.values.length),
      datasets: [{ label: `Sound pressure (${data.soundPressure.unit})`, data: data.soundPressure.values, borderColor: '#d97706', borderWidth: 1.5 }] },
    options: lineOpts,
  });
  new Chart(document.getElementById('c-foot'), {
    type: 'line',
    data: { labels: labels(data.footSpeed.values.length),
      datasets: [{ label: `Foot speed (${data.footSpeed.unit})`, data: data.footSpeed.values, borderColor: '#dc2626', borderWidth: 1.5 }] },
    options: lineOpts,
  });
  new Chart(document.getElementById('c-steps'), {
    type: 'bar',
    data: { labels: data.aggregates.stepLengths.values.map((_, i) => `Step ${i + 1}`),
      datasets: [{ label: `Step length (${data.aggregates.stepLengths.unit})`, data: data.aggregates.stepLengths.values, backgroundColor: '#60a5fa' }] },
    options: lineOpts,
  });
}

// ---------------------------------------------------------------------------
// Router
// ---------------------------------------------------------------------------
async function route() {
  const hash = location.hash || '#/experiments';
  const [pathPart, queryPart] = hash.slice(1).split('?');
  const query = new URLSearchParams(queryPart || '');
  const page = Math.max(1, parseInt(query.get('page'), 10) || 1);
  const parts = pathPart.split('/').filter(Boolean);

  document.getElementById('nav-experiments').classList.toggle('active', parts[0] !== 'exercises');
  document.getElementById('nav-exercises').classList.toggle('active', parts[0] === 'exercises' && !parts[1]);

  try {
    if (parts[0] === 'experiments' && parts[1]) await viewExperimentDetail(parts[1]);
    else if (parts[0] === 'exercises' && parts[1]) await viewExerciseDetail(parts[1]);
    else if (parts[0] === 'exercises') await viewAllExercises(page);
    else await viewExperiments(page);
  } catch (err) {
    $view.innerHTML = `<div class="card"><div class="empty">⚠️ ${esc(err.message)}</div></div>`;
  }
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
